aid: cashplus
url: https://raw.githubusercontent.com/api-evangelist/cashplus/refs/heads/main/apis.yml
name: Cashplus Bank
kind: company
description: >-
  Cashplus Bank (legal entity Advanced Payment Solutions Limited, rebranded to
  Zempler Bank in July 2024) is a UK challenger bank founded in 2005 that grew
  from a prepaid-card issuer into a fully licensed bank, receiving its UK banking
  licence in 2021 and regulated by the Financial Conduct Authority (FCA) and the
  Prudential Regulation Authority (PRA). It focuses on business current accounts,
  personal current accounts, credit cards, and payments for micro-enterprises,
  sole traders, and small-to-medium businesses. Following a 2026 acquisition it
  operates as a subsidiary of The Access Bank UK (part of Nigeria's Access Bank
  plc). As an FCA-authorised ASPSP it participates in UK Open Banking under PSD2,
  publishing Read/Write APIs conformant to the Open Banking Implementation Entity
  (OBIE) standard - Account Information (AIS), Payment Initiation (PIS), and
  Confirmation of Funds (CBPII) - secured with FAPI-grade OAuth2/OIDC, mutual-TLS,
  PSD2 strong customer authentication, and OBIE/eIDAS certificates. Cashplus is
  not one of the CMA9 mandated banks. Alongside the regulated Open Banking
  surface it runs a first-party partner/developer platform documenting proprietary
  Identity, Accounts, Applications, Eligibility, Payments, Products, and
  Transactions APIs for embedded and commercial integrations.
