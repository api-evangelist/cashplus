apis:
- aid: cashplus:cashplus-account-information-api
  name: Cashplus Account Information API
  description: >-
    Open Banking Account Information Service Provider (AISP) API conformant to the
    OBIE Read/Write API Standard, exposing account access consents, account
    details, balances, transactions, standing orders, direct debits, beneficiaries,
    and statements. Secured with FAPI OAuth2/OIDC, mutual-TLS, and PSD2 strong
    customer authentication. The harvested OpenAPI is the shared OBIE standard the
    bank conforms to, not a bank-proprietary contract.
  humanURL: https://developer.zemplerbank.com/developer-guides/open-banking/identity
  baseURL: ''
  tags:
  - Account Information
  - AISP
  - Open Banking
  - PSD2
  - OBIE
