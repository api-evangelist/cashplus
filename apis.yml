    url: https://www.zemplerbank.com/api/
- aid: cashplus:cashplus-confirmation-of-funds-api
  name: Cashplus Confirmation of Funds API
  description: >-
    Open Banking Card Based Payment Instrument Issuer (CBPII) Confirmation of Funds
    API conformant to the OBIE Read/Write API Standard, letting authorised
    providers establish a funds-confirmation consent and check whether sufficient
    funds are available on a customer account, secured with FAPI OAuth2/OIDC, PSD2
    SCA, and mutual-TLS. The harvested OpenAPI is the shared OBIE standard the bank
    conforms to, not a bank-proprietary contract.
  humanURL: https://developer.zemplerbank.com/developer-guides/open-banking/identity
