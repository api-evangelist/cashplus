  - type: APIReference
    url: https://www.zemplerbank.com/api/
- aid: cashplus:cashplus-payment-initiation-api
  name: Cashplus Payment Initiation API
  description: >-
    Open Banking Payment Initiation Service Provider (PISP) API conformant to the
    OBIE Read/Write API Standard, supporting domestic payments, domestic scheduled
    payments, and domestic standing orders with the customer approving each payment
    via PSD2 strong customer authentication over FAPI OAuth2/OIDC and mutual-TLS.
    The harvested OpenAPI is the shared OBIE standard the bank conforms to, not a
    bank-proprietary contract.
  humanURL: https://developer.zemplerbank.com/developer-guides/open-banking/identity
  baseURL: ''
