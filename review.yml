  - url: https://www.openbankingtracker.com/provider/cashplus
    type: Reference
    note: Third-party Open Banking tracker confirming Cashplus AIS/PIS products and legacy sandbox host apisandbox.mycashplus.co.uk.
actions:
  apisYmlUpdated: true
  openapiHarvested:
    - openapi/cashplus-account-information-openapi.yml
    - openapi/cashplus-payment-initiation-openapi.yml
    - openapi/cashplus-confirmation-of-funds-openapi.yml
  reason: |
    Cashplus (now Zempler) exposes a real developer platform with seven
    documented first-party partner APIs and a PSD2/OBIE Read/Write Open Banking
    surface (AIS/PIS/CBPII). The three OBIE v3.1.11 standard specs were harvested
    verbatim with provenance clearly marked as the shared standard, not a
    proprietary contract. No unauthenticated Open Data endpoint exists (non-CMA9
    challenger), and OBIE/FAPI auth is documented but not live-verified because
    no public OIDC discovery document is reachable. Base URLs were left empty
    rather than fabricated. Pricing/access derivation is left to the enrichment
    pipeline.
