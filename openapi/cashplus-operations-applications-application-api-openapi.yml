openapi: 3.2.0
info:
  description: 'The Zempler application API allows you to create applications to open new bank accounts. To help you start working with our application API as quickly and easily as possible, please have a read of the guide below. If you get stuck at any point, please email api.support@zemplerbank.com.


    Sandbox


    This Sandbox environment provides a means to test integrations prior to going live so it doesn''t perform any live identity / company verification.


    Please use the ClientID: aps.swagger.client and Secret: secret for sandbox.


    You can test different responses by altering the final digit of the mobile number submitted - see the explanation below under the section titled "TESTING DIFFERENT APPLICATION STATUSES" for more details.


    Submit An Application For A Current Account


    To submit an application, please complete the following 4 simple steps:


    Retrieve the two parameters required to submit an application:


    Industry Id - select the relevant industry id for the business you''re opening the account for from the list of industries found in the /application/industries endpoint.


    Terms and conditions reference number - The product terms and conditions are available on the /products/products endpoint. It''s important you refresh each time to get the latest version.


    This will provide a {tCsReferenceNumber} and associated URL. Terms and conditions need to be displayed to and approved by the applicant before you submit the application.


    Submit all required data fields specified to the /application/business/limited endpoint. Data descriptions are available by clicking the ''Model'' link under ''Data Type'' heading in the parameter list.


    The response you receive will contain a message describing the status of the application. If the application is approved immediately, the response will also contain the {sortCode} and {accountNumber} for the account. Otherwise, please store the {referenceNumber} to check the application status later.


    If manual review or documents are required, the status can be checked later via the /application/status endpoint. You can also retrieve the {sortCode} and {accountNumber} from the /application/clearingInfo after the application is approved. Both endpoints require the {referenceNumber} returned in step 3.


    Testing Different Application Statuses


    To test different responses to application requests, simply change the last number of the mobile number to:


    0 = ''Duplicate'' application status


    1 = ''InternalReview'' status


    2 = ''DocsRequired'' status


    3-9 = ''Approved'' status


    (e.g. 07111222333 or 07111222338 would return ''Approved'', while 07111222332 would return ''DocsRequired'')'
  version: v1
  title: Zempler API - Applications Operations Applications…
servers:
- url: https://apisandbox.zempler.tech/applications/
tags:
- name: Operations Applications - Application
paths:
  /application/industries:
    get:
      tags:
      - Operations Applications - Application
      summary: Get the list of Industries
      operationId: GETapplication/industries
      parameters:
      - name: skip
        in: query
        description: Bypasses a specified number of elements in a sequence and then returns the remaining elements.
        required: false
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Returns a specified number of contiguous elements from the start of a sequence.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: List of industries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LEAPS.Applications.Contracts.Domain.ValueObjects.Industry'
              example:
              - IndustryId: 2
                Name: Accommodation and food service
              - IndustryId: 3
                Name: Administrative and support service
              - IndustryId: 4
                Name: Agriculture, Forestry and Fishing
              - IndustryId: 5
                Name: Arts, entertainment and recreation
              - IndustryId: 6
                Name: Construction
              - IndustryId: 7
                Name: Education
              - IndustryId: 8
                Name: Electricity, gas, steam and air conditioning supply
              - IndustryId: 9
                Name: Household
              - IndustryId: 10
                Name: Human health and social work
              - IndustryId: 11
                Name: Information and communication
              - IndustryId: 12
                Name: Manufacturing
              - IndustryId: 13
                Name: Mining
              - IndustryId: 14
                Name: Other service
              - IndustryId: 15
                Name: Professional, scientific and technical
              - IndustryId: 16
                Name: Public administration and defence; compulsory social security
              - IndustryId: 17
                Name: Real estate
              - IndustryId: 18
                Name: Regulated Financial and insurance
              - IndustryId: 19
                Name: Repair of motor vehicles and motorcycles
              - IndustryId: 20
                Name: Transportation and storage
              - IndustryId: 21
                Name: Unregulated Financial and insurance
              - IndustryId: 22
                Name: Water supply, sewerage, waste management and remediation
              - IndustryId: 23
                Name: Wholesale and retail trade
              - IndustryId: 24
                Name: Contracting & Consulting
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LEAPS.Applications.Contracts.Domain.ValueObjects.Industry'
      security:
      - oauth2:
        - aps_profile
        - applications
        - accounts
        - payments
        - eligibility
